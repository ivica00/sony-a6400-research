<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="822" viewBox="0 0 1000 822" role="img" aria-labelledby="title desc">
<title id="title">Sony a6400 research status through E0296</title>
<desc id="desc">669 tests passed in the last recorded full suite. E0289 showed the e0288 liveview-consistency module keeping the composite enumerated through liveview with a clean teardown. E0290-E0292 added GetObject diagnostics, found the host WPD COM shutdown at liveview start, and fixed the reconnect retry. E0293-E0295 showed the MI_00 WPD child installs but the WPD API list was empty, and fixed the snapshot timing. E0296: the device stayed enumerated, but the camera became unresponsive after liveview (operator restarted it); the reconnect budget was too short. Next: a minimal variant that drops the UVC overlay on the app stop but does not re-arm EP0/pullup in the start wrapper, then the snapshot3 test with a larger retry budget.</desc>
<rect width="1000" height="822" rx="16" fill="#0d1117" />
