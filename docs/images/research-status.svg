<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="822" viewBox="0 0 1000 822" role="img" aria-labelledby="title desc">
<title id="title">Sony a6400 research status through E0239</title>
<desc id="desc">624 tests passed in the last recorded full suite. Guest emulation reaches the im.elf entry point and event phase 1 of 8, with 36/36 ARM syscall contracts, 20/20 ext2, 14/14 mmap and 13/13 uIPC cases; full boot is not claimed and 0 of 198 static plugin definitions are initialized. The firmware census covers 474 inventoried ELF modules with 74,134 exported function symbols (63,992 unique names) and 8,658 unique imports; 289 functions have retained static analysis, while internal/static functions remain unenumerated. Host-written artifacts are shown separately: the custom menu is drawn on the camera display but is not firmware compatibility. PTP liveview transferred a 1024x680 sensor JPEG, while PTP control transactions remain unverified. Static 720p UVC transport measured 29.9592 FPS; composite children enumerate but the Windows parent reports Code 10 and teardown is unresolved. The journal path was corrected to 8.3 A:/A6400J.DAT offline, but an intermittent PC Remote self-reboot blocks physical deployment. A bounded JPEG frame-metadata parser passes offline UVC checks but is not wired into Update. Tiles are qualitative states, not completion percentages.</desc>
