name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile Python sources
        run: python -m compileall -q src tools tests legacy

      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Repository structure, target profiles and status synchronization
        run: >-
          python -m unittest
          tests.test_repository_layout
          tests.test_target_profiles
          tests.test_research_status_sync
          tests.test_research_status_dashboard
          -v

      - name: Verify the status card matches its snapshot
        run: python -m tools.research.render_research_status --check

      - name: Reject accidental large tracked files
        run: |
          git ls-files -z | xargs -0 -n1 --no-run-if-empty stat -c '%s %n' \
            | awk '$1 > 2097152 { print "tracked file larger than 2 MiB: " $2; exit 1 }'

      - name: Reject tracked proprietary binaries
        run: |
          if git ls-files | grep -Ei '\.(so|ko|elf|bin|img|raw|dat|tar)$'; then
            echo "proprietary binary extension tracked; see .gitignore" >&2
            exit 1
          fi

      - name: Verify contributor docs and layout exist
        run: |
          test -f docs/CONTRIBUTING_UVC_PTP.md
          test -f docs/UVC_PTP_STATUS.md
          test -f docs/ADDING_A_BIONZX_CAMERA.md
          test -f docs/REPOSITORY.md
          test -f docs/images/research-status.svg
          test -f scripts/launch_cinemahud_ptp.bat
          test -f scripts/launch_cinemahud_android.ps1
          test -f scripts/launch_cinema_mpv.bat
          test -f scripts/start_camera_shell.bat
          test -f .github/ISSUE_TEMPLATE/uvc-ptp-task.yml
          grep -q 'CONTRIBUTING_UVC_PTP' README.md
          grep -q 'CONTRIBUTING_UVC_PTP' CONTRIBUTING.MD
          grep -q 'ADDING_A_BIONZX_CAMERA' README.md
          grep -q 'ADDING_A_BIONZX_CAMERA' CONTRIBUTING.MD

      - name: Verify no forwarding shims returned to the root
        run: |
          for name in analyze_hardware_drivers.py backup_camera.py check_camera.py \
                      cxd90045_gui_runner.py cxd90045_hle_emulator.py firmware_analyzer.py \
                      sony_gui_simulator.py test_authentic_screens.py unpack_firmware.py; do
            if [ -e "$name" ]; then
              echo "removed forwarding shim is back in the repository root: $name" >&2
              exit 1
            fi
          done
