name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails & Layout (stdlib)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run local/CI parity guardrails
        run: python -m tools.research.ci_check --summary

      - name: Verify structural and status-sync suites
        run: |
          python -m unittest \
            tests.test_repository_layout \
            tests.test_target_profiles \
            tests.test_research_status_sync \
            tests.test_research_status_dashboard \
            tests.test_agents_md_archive_integrity \
            tests.test_ci_check -v

      - name: Verify SVG status dashboard is up to date
        run: python -m tools.research.render_research_status --check

  emulator-suite:
    name: Emulator Suite (${{ matrix.os }})
    needs: guardrails
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full offline test suite
        run: python -m unittest discover -s tests -v

  native-probes:
    name: Native Probes (ARMv7 & Host)
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ARMv7 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Run host-check probe harness
        run: python probes/build_probe.py --host-check

      - name: Cross-compile uvc_dma_probe for ARMv7
        run: |
          mkdir -p probes/build/ci-arm
          arm-linux-gnueabi-gcc \
            -std=gnu11 -march=armv7-a -mfloat-abi=softfp -O2 \
            -Wall -Wextra -Werror \
            -ffreestanding -nostdlib -static -fno-stack-protector -fno-pic -fno-pie \
            -Wl,-e,_start \
            probes/uvc_dma_probe.c -o probes/build/ci-arm/uvc_dma_probe

      - name: Run probe report tests
        run: python -m unittest tests.test_probes_report -v

  pr-summary:
    name: CI Summary
    needs: [guardrails, emulator-suite, native-probes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        run: |
          {
            echo "## CI Pipeline Results"
            echo ""
            echo "| Job | Result |"
            echo "| :--- | :---: |"
            echo "| \`guardrails\` | \`${{ needs.guardrails.result }}\` |"
            echo "| \`emulator-suite\` | \`${{ needs.emulator-suite.result }}\` |"
            echo "| \`native-probes\` | \`${{ needs.native-probes.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
