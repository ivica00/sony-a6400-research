# Project-wide Gradle settings.
# AndroidX is deliberately NOT used by this client; keep the flag explicit so a
# future dependency cannot silently pull it in.
android.useAndroidX=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# The NDK/CMake paths are resolved from the SDK, never hardcoded here.
